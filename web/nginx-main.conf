# Main nginx configuration for the non-root Onramp container.
#
# The official nginx image's default main config writes the pid to
# /var/run/nginx.pid (root-owned), which fails when the master process runs
# as the unprivileged `nginx` user. This config relocates the pid and error
# log to /tmp (writable) so the container starts as USER nginx.

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /tmp/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limiting zone (used by server blocks)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Proxy buffering defaults
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    include /etc/nginx/conf.d/*.conf;
}
