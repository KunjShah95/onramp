<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDE1DD"/>
      <stop offset="100%" stop-color="#C8CCC6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7A3C"/>
      <stop offset="100%" stop-color="#0A5E2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="158" x2="1200" y2="158" stroke="#181B18" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#181B18" stroke-width="0.5"/>
    <line x1="0" y1="473" x2="1200" y2="473" stroke="#181B18" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#181B18" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#181B18" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#181B18" stroke-width="0.5"/>
  </g>

  <!-- Ambient accent circle -->
  <circle cx="900" cy="200" r="300" fill="#0E7A3C" opacity="0.06"/>
  <circle cx="200" cy="500" r="200" fill="#0E7A3C" opacity="0.04"/>

  <!-- Logo icon -->
  <rect x="76" y="72" width="56" height="56" rx="12" fill="url(#accent)" filter="url(#glow)"/>
  <g transform="translate(90, 86)">
    <path d="M12 0C5.373 0 0 5.373 0 12v4h4v-4c0-4.418 3.582-8 8-8s8 3.582 8 8v4h4v-4c0-6.627-5.373-12-12-12z" fill="white" opacity="0.9"/>
    <rect x="6" y="12" width="12" height="12" rx="2" fill="white" opacity="0.95"/>
    <rect x="9" y="15" width="6" height="2" rx="1" fill="#0E7A3C"/>
    <rect x="9" y="19" width="4" height="2" rx="1" fill="#0E7A3C"/>
  </g>

  <!-- Title -->
  <text x="152" y="117" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#181B18" letter-spacing="-0.5">Onramp</text>

  <!-- Headline -->
  <text x="76" y="238" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="700" fill="#181B18" letter-spacing="-1.5">
    <tspan x="76" dy="0">Onboard developers</tspan>
    <tspan x="76" dy="72">in <tspan fill="#0E7A3C" font-style="italic">hours,</tspan> not weeks.</tspan>
  </text>

  <!-- Description -->
  <text x="76" y="385" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#6C716A" letter-spacing="-0.3">
    AI-powered developer onboarding platform
  </text>
  <text x="76" y="420" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#6C716A" letter-spacing="-0.3">
    Maps architecture, guides engineers, tracks progress.
  </text>

  <!-- Trust indicators -->
  <g transform="translate(76, 478)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="white" fill-opacity="0.6" stroke="#181B18" stroke-opacity="0.08"/>
    <text x="16" y="26" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0E7A3C">✓ No credit card</text>
  </g>
  <g transform="translate(272, 478)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="white" fill-opacity="0.6" stroke="#181B18" stroke-opacity="0.08"/>
    <text x="16" y="26" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0E7A3C">✓ 2-minute setup</text>
  </g>
  <g transform="translate(468, 478)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="white" fill-opacity="0.6" stroke="#181B18" stroke-opacity="0.08"/>
    <text x="16" y="26" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0E7A3C">✓ SOC 2 Compliant</text>
  </g>

  <!-- Right side decorative mockup -->
  <g transform="translate(660, 100)">
    <rect x="0" y="0" width="470" height="420" rx="12" fill="white" stroke="#181B18" stroke-opacity="0.1"/>
    <!-- Mockup sidebar -->
    <rect x="0" y="0" width="140" height="420" rx="12" fill="#F8F9F7"/>
    <rect x="16" y="20" width="108" height="24" rx="6" fill="#0E7A3C" fill-opacity="0.12"/>
    <text x="30" y="37" font-family="'SF Pro Display', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0E7A3C">Overview</text>
    <rect x="16" y="54" width="108" height="24" rx="6" fill="transparent"/>
    <text x="30" y="71" font-family="'SF Pro Display', system-ui, sans-serif" font-size="12" fill="#8A8F88">Map</text>
    <rect x="16" y="88" width="108" height="24" rx="6" fill="transparent"/>
    <text x="30" y="105" font-family="'SF Pro Display', system-ui, sans-serif" font-size="12" fill="#8A8F88">Ask Onramp</text>

    <!-- Mockup content -->
    <text x="162" y="36" font-family="'SF Pro Display', system-ui, sans-serif" font-size="14" font-weight="600" fill="#181B18">Good morning, Alex</text>
    <text x="162" y="56" font-family="'SF Pro Display', system-ui, sans-serif" font-size="11" fill="#8A8F88">Here's what's happening with your codebase.</text>

    <!-- Stat cards -->
    <rect x="162" y="78" width="130" height="62" rx="6" fill="#FAFAFA" stroke="#181B18" stroke-opacity="0.06"/>
    <text x="176" y="98" font-family="'SF Pro Display', system-ui, sans-serif" font-size="10" fill="#8A8F88">Codebase health</text>
    <text x="176" y="122" font-family="'SF Pro Display', system-ui, sans-serif" font-size="20" font-weight="700" fill="#181B18">92%</text>

    <rect x="304" y="78" width="130" height="62" rx="6" fill="#FAFAFA" stroke="#181B18" stroke-opacity="0.06"/>
    <text x="318" y="98" font-family="'SF Pro Display', system-ui, sans-serif" font-size="10" fill="#8A8F88">Active onboarding</text>
    <text x="318" y="122" font-family="'SF Pro Display', system-ui, sans-serif" font-size="20" font-weight="700" fill="#181B18">12</text>

    <!-- Activity list -->
    <rect x="162" y="154" width="272" height="60" rx="6" fill="#FAFAFA" stroke="#181B18" stroke-opacity="0.06"/>
    <circle cx="178" cy="175" r="4" fill="#0E7A3C"/>
    <text x="192" y="179" font-family="'SF Pro Display', system-ui, sans-serif" font-size="11" fill="#565B54">New engineer onboarded</text>
    <text x="400" y="179" font-family="'SF Pro Display', system-ui, sans-serif" font-size="10" fill="#8A8F88">2h ago</text>
    <circle cx="178" cy="195" r="4" fill="#B5710A"/>
    <text x="192" y="199" font-family="'SF Pro Display', system-ui, sans-serif" font-size="11" fill="#565B54">Architecture updated</text>
    <text x="400" y="199" font-family="'SF Pro Display', system-ui, sans-serif" font-size="10" fill="#8A8F88">1d ago</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#181B18" fill-opacity="0.03"/>
  <text x="76" y="610" font-family="'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="13" fill="#6C716A">onramp.dev</text>
  <text x="1050" y="610" font-family="'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="13" fill="#6C716A">AI-Powered Developer Onboarding</text>
</svg>
