<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />    <meta data-seo="robots" name="robots" content="index, follow" />
    <script>
      // Pre-paint landing mode — runs before first paint so returning
      // visitors never see a light flash before the dark surface (or vice
      // versa). Mirrors useLandingTheme's storage key; dark is the default.
      try {
        if (localStorage.getItem('onramp-landing-mode') === 'light') {
          document.documentElement.classList.add('landing-mode-light')
        }
      } catch (e) { /* storage unavailable — keep dark default */ }
    </script>
    <meta data-seo="description" name="description" content="Onramp · AI-powered developer onboarding. Go from codebase to contribution in minutes with a live architecture map and an AI mentor grounded in your real code." />
    <link data-seo="canonical" rel="canonical" href="%VITE_APP_URL%/"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Onramp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <title>Onramp · AI-Powered Developer Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load async via external script (no inline onload — CSP nonce-based).
         font-display=swap means text renders immediately in the fallback and swaps in.
         Keep this URL in sync with the old @import removed from src/index.css. -->
    <link id="google-fonts" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Open Graph / Facebook (data-seo attrs let the Seo component update them per page) -->
    <meta data-seo="og:site_name" property="og:site_name" content="Onramp" />
    <meta data-seo="og:locale" property="og:locale" content="en_US" />
    <meta data-seo="og:type" property="og:type" content="website" />
    <meta data-seo="og:title" property="og:title" content="Onramp · AI-Powered Developer Onboarding" />
    <meta data-seo="og:description" property="og:description" content="Go from codebase to contribution in minutes. Onramp uses advanced AI to analyze repositories, create custom onboarding paths, generate quizzes, and guide developers through their first PR." />
    <meta data-seo="og:url" property="og:url" content="%VITE_APP_URL%/" />
    <meta data-seo="og:image" property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta data-seo="og:image:alt" property="og:image:alt" content="Onramp · AI-powered developer onboarding" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta data-seo="twitter:card" name="twitter:card" content="summary_large_image" />
    <meta data-seo="twitter:title" name="twitter:title" content="Onramp · AI-Powered Developer Onboarding" />
    <meta data-seo="twitter:description" name="twitter:description" content="Go from codebase to contribution in minutes. Onramp uses advanced AI to analyze repositories, create custom onboarding paths, generate quizzes, and guide developers through their first PR." />
    <meta data-seo="twitter:image" name="twitter:image" content="%VITE_APP_URL%/og-image.png" />
    <meta data-seo="twitter:image:alt" name="twitter:image:alt" content="Onramp · AI-powered developer onboarding" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Onramp",
      "url": "%VITE_APP_URL%/",
      "logo": "%VITE_APP_URL%/icon-512.svg",
      "description": "AI-powered developer onboarding. Onramp indexes your codebase into a live architecture map and guides developers through their first PR.",
      "sameAs": [
        "https://twitter.com/onramp_ai",
        "https://linkedin.com/company/onramp-ai",
        "https://github.com/onramp-ai"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-555-123-4567",
        "contactType": "customer service",
        "availableLanguage": "English",
        "url": "%VITE_APP_URL%/contact"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Onramp",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "url": "%VITE_APP_URL%/",
      "description": "AI-powered developer onboarding: live architecture map, guided paths, graded tasks, and review queue. New devs land their first merged PR faster.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Onramp",
      "url": "%VITE_APP_URL%/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "%VITE_APP_URL%/docs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/font-loader.js"></script>
  </body>
</html>
