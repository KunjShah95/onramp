# Prometheus scrape configuration — Onramp observability stack.
# Used by docker-compose.prod.yml (service: prometheus).
#
# The backend exposes /metrics (dependency-free Prometheus text format).
# Alerting/recording rules can be dropped into ./prometheus/rules/ and
# included via rule_files below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "onramp-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: onramp-api
          env: production

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
