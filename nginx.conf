# Site config for Onramp frontend (Nginx 1.27, non-root, port 8080).
# Proxies /api/* → backend:8000, serves SPA with fallback, exposes /healthz.

upstream onramp_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Request limits
    client_max_body_size 4m;
    limit_req_status 429;

    # Security headers (also set by backend SecurityHeadersMiddleware)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is only emitted when the request arrived over HTTPS (including the
    # usual TLS-terminating proxy). Keep the policy below configurable here;
    # never advertise HSTS on an HTTP development origin.
    set $hsts_policy "";
    if ($scheme = https) {
        set $hsts_policy "max-age=31536000; includeSubDomains";
    }
    if ($http_x_forwarded_proto = https) {
        set $hsts_policy "max-age=31536000; includeSubDomains";
    }
    add_header Strict-Transport-Security $hsts_policy always;
    # VITE_API_URL may point at a separately hosted HTTPS API origin. The broad
    # HTTPS source keeps the policy compatible with deployment-time API URLs;
    # CORS still controls browser access to that origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Health check for docker-compose / load balancers
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Proxy API to backend service
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://onramp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_buffer_size 8k;
    }

    # Proxy OpenAI-compatible gateway
    location /v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://onramp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_buffer_size 8k;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }
}
