# ── Onramp Frontend — Nginx Configuration ─────────────────────────────
# Serves the built React app (dist/) with:
#   - Gzip compression (brotli handled at backend ASGI layer)
#   - Aggressive Cache-Control for fingerprinted assets (immutable)
#   - Short TTL for non-fingerprinted resources
#   - API reverse proxy to backend
#   - Security headers
#
# Used by:
#   - docker-compose prod frontend container
#   - Self-hosted / air-gapped deployments
# ────────────────────────────────────────────────────────────────────────

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  application/javascript
  application/json
  application/x-javascript
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ──────────────────────────────────────────────────
    # Forward /api/* requests to the backend. Handles both HTTP and
    # WebSocket upgrades (WS is at /api/v1/ws/*). Backend ASGI layer
    # handles Brotli+gzip response compression.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for SSE / streaming AI responses
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # ── Fingerprinted static assets (content-hashed) ───────────────
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # ── Non-fingerprinted assets (favicon, images, fonts) ──────────
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # ── JSON data files ────────────────────────────────────────────
    location ~* \.(?:json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA entry point + security headers ─────────────────────────
    location / {
        # Never cache index.html — always serve the latest
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # SPA fallback — serve index.html for all non-file routes
        try_files $uri $uri/ /index.html;
    }

    # ── Deny source maps in production ─────────────────────────────
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny hidden / sensitive files ──────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(?:node_modules|src|env|\.env) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
