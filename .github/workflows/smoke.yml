name: Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployment origin, e.g. https://staging.example.com'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Run health/readiness smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          if [ -n "$SMOKE_API_KEY" ]; then
            python backend/scripts/smoke_test.py --base-url "$SMOKE_BASE_URL" --api-key "$SMOKE_API_KEY"
          else
            python backend/scripts/smoke_test.py --base-url "$SMOKE_BASE_URL"
          fi
