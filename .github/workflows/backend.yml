name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Default: local CI Postgres. Override via repo secret to point to NeonDB.
      # NOTE: the ${{ }} expression must stay on ONE line — multi-line
      # expressions are invalid in GitHub Actions and fail the workflow parse.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://postgres:postgres@localhost:5432/onramp_test' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: onramp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock.txt"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.lock.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov httpx ruff pip-audit

      - name: Check code compiles
        run: python -m compileall backend/app

      - name: Lint (ruff — errors only)
        run: ruff check backend/app --select E9,F63,F7,F82

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: pip-audit -r backend/requirements.lock.txt --desc

      - name: Create .env and run migrations
        run: |
          grep -v '^\[TEMPLATE\]' backend/.env.example > backend/.env 2>/dev/null || cp backend/.env.example backend/.env
          echo "DATABASE_URL=$DATABASE_URL" >> backend/.env
          cd backend && alembic upgrade head

      - name: Run unit & integration tests (memory backend)
        run: |
          cd backend && python -m pytest tests/ -v --timeout=30 \
            --ignore=tests/test_api_contract.py \
            --ignore=tests/test_load_performance.py \
            --cov=app --cov-report=term-missing --cov-report=xml
        env:
          ENV: test
          STORAGE_BACKEND: memory
          GROQ_API_KEY: sk-test-placeholder
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}

      - name: Run API contract tests (35 tests — response schemas & error shapes)
        run: |
          cd backend && python -m pytest tests/test_api_contract.py -v --timeout=30 --cov=app --cov-report=term-missing --cov-report=xml --cov-append
        env:
          ENV: test
          STORAGE_BACKEND: memory
          GROQ_API_KEY: sk-test-placeholder
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}

      - name: Run load/performance tests (13 tests — latency & concurrent throughput)
        run: |
          cd backend && python -m pytest tests/test_load_performance.py -v --timeout=120 --cov=app --cov-report=term-missing --cov-report=xml --cov-append
        env:
          ENV: test
          STORAGE_BACKEND: memory
          GROQ_API_KEY: sk-test-placeholder
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}

      - name: Run tests (PostgreSQL backend)
        run: |
          cd backend && python -m pytest tests/test_task_service.py tests/test_notification_service.py tests/test_gamification.py -v --timeout=60 --run-postgres --cov=app --cov-append
        env:
          ENV: test
          STORAGE_BACKEND: postgres
          GROQ_API_KEY: sk-test-placeholder
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage.xml
