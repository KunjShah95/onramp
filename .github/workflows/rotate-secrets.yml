name: Rotate internal secrets

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      target:
        description: "Secret(s) to rotate"
        required: true
        default: all-internal
        type: choice
        options:
          - enc-key
          - hmac-secret
          - all-internal

# Needs:
#   contents: write     - commit/push the audit-log branch
#   pull-requests: write - open the rotation PR
#   secrets: write      - gh secret set writes repo Actions secrets
#   id-token: write     - for OIDC token exchange (if needed for deploy platforms)
permissions:
  contents: write
  pull-requests: write
  # secrets: write  ← REMOVED: GITHUB_TOKEN cannot write secrets in most contexts; use SECRETS_ADMIN_PAT

concurrency:
  group: rotate-secrets
  cancel-in-progress: false

jobs:
  rotate:
    name: Generate and rotate secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install cryptography
        run: pip install cryptography

      - name: Validate secret-admin credentials
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SECRETS_ADMIN_PAT is required to rotate repository secrets."
            exit 1
          fi
          gh auth status

      # ── Generate and rotate (target-aware) ────────────────────────────────
      # Generate each value directly inside the step that writes it. Values
      # never pass through GITHUB_OUTPUT, shell interpolation, or workflow logs.
      # enc-key → both Fernet keys; hmac-secret → the HMAC pepper;
      # all-internal (default, incl. the scheduled run) → all three.
      # Requires SECRETS_ADMIN_PAT (classic PAT with repo:admin scope or fine-grained
      # with "Repository secrets" write). GITHUB_TOKEN cannot write secrets.

      - name: Rotate PII_ENCRYPTION_KEY
        if: inputs.target != 'hmac-secret'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          gh secret set PII_ENCRYPTION_KEY --body "$KEY"

      - name: Rotate GITHUB_TOKEN_ENCRYPTION_KEY
        if: inputs.target != 'hmac-secret'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          gh secret set GITHUB_TOKEN_ENCRYPTION_KEY --body "$KEY"

      - name: Rotate API_KEY_HMAC_SECRET
        if: inputs.target != 'enc-key'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
        run: |
          SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          gh secret set API_KEY_HMAC_SECRET --body "$SECRET"

      # ── Audit trail (no secret values — just what/when) ─────────────────────

      - name: Record rotation in audit log
        run: |
          mkdir -p .github
          echo "- $(date -u +%Y-%m-%d): rotated \`${{ inputs.target || 'all-internal' }}\` (workflow run ${{ github.run_id }})" >> .github/secret-rotation-log.md

      - name: Commit and push audit log
        id: commit-log
        run: |
          set -euo pipefail
          # run_id suffix keeps the branch unique across same-day re-runs.
          BRANCH="chore/rotate-secrets-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.name "onramp-ops-bot"
          git config user.email "ops-bot@onramp.dev"
          git checkout -b "$BRANCH"
          git add .github/secret-rotation-log.md
          if git diff --cached --quiet; then
            echo "No changes to commit — rotation log already up to date."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: rotate internal secrets ($(date +%Y-%m-%d))"
          git push origin "$BRANCH"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.commit-log.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BODY: |
            Rotated ${{ inputs.target || 'all-internal' }} into the repo Actions secrets
            (PII_ENCRYPTION_KEY, GITHUB_TOKEN_ENCRYPTION_KEY, API_KEY_HMAC_SECRET).

            The values are stored encrypted in GitHub — do NOT commit them to the repo.

            **Action required:** mirror the new values into the deploy platforms'
            environment settings (Vercel project env + Render service env) and, if
            self-hosting on Kubernetes, into the onramp-secrets Secret (kubectl patch).
            See workflow run ${{ github.run_id }} for confirmation.

            After mirroring, set API_KEY_ALLOW_LEGACY_PEPPER=false once all API
            keys are regenerated.
        run: |
          # Use the repo's actual default branch instead of hardcoding main.
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "${{ steps.commit-log.outputs.branch }}" \
            --title "chore: rotate internal secrets ($(date +%Y-%m-%d))" \
            --body "$GH_BODY"

      # Deployment-platform environment variables must be mirrored separately;
      # generated values are never emitted as job outputs or workflow logs.
      # See the PR instructions above for the required operator follow-up.
