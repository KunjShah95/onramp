name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "web/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: web

      - name: Dependency vulnerability scan (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: web

      - name: Run unit tests
        run: npx vitest run --testTimeout 15000 --exclude '**/test/bundle/**'
        working-directory: web

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install chromium
        working-directory: web

      - name: Run a11y audit tests (axe-core scans of public pages)
        run: npx playwright test e2e/a11y.spec.ts --project=chromium
        working-directory: web

      - name: Run E2E tests (auth, dashboard, review queue, explore, billing, team)
        run: npx playwright test e2e/auth.spec.ts e2e/dashboard.spec.ts e2e/review-queue.spec.ts e2e/explore.spec.ts e2e/billing.spec.ts e2e/team.spec.ts --project=chromium --workers=1 --timeout=60000
        working-directory: web

      - name: Run Lighthouse performance audit tests
        run: npx playwright test e2e/performance/lighthouse.test.ts --project=chromium --timeout=60000
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Bundle size analysis
        run: npx vitest run test/bundle/bundle-analysis.test.ts --testTimeout 30000
        working-directory: web
