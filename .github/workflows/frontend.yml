name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "web/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: web

      # Shipped (production) deps block on high; build-time dev deps block on
      # critical. braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm, via tailwindcss 3 ->
      # chokidar/micromatch) has no patched release; the only remedy is the
      # Tailwind v4 migration. It runs at build time over our own source globs.
      - name: Dependency vulnerability scan (npm audit, production)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - name: Dependency vulnerability scan (npm audit, dev)
        run: npm audit --audit-level=critical
        working-directory: web

      - name: Run unit tests
        run: npx vitest run --testTimeout 15000 --exclude '**/test/bundle/**'
        working-directory: web

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install chromium
        working-directory: web

      - name: Run a11y audit tests (axe-core scans of public pages)
        run: npx playwright test e2e/a11y.spec.ts --project=chromium
        working-directory: web

      - name: Run E2E tests (auth, dashboard, review queue, explore, billing, team, repo-access, ide)
        run: npx playwright test e2e/auth.spec.ts e2e/dashboard.spec.ts e2e/review-queue.spec.ts e2e/explore.spec.ts e2e/billing.spec.ts e2e/team.spec.ts e2e/new-dev-repo-access.spec.ts e2e/ide.spec.ts e2e/register-repo.spec.ts --project=chromium --workers=1 --timeout=60000
        working-directory: web

      - name: Run concurrent-load test (8 visitors, hang sentinel)
        run: npx playwright test e2e/performance/load.spec.ts --project=chromium --workers=1 --timeout=90000
        working-directory: web

      - name: Run Lighthouse performance audit tests
        run: npx playwright test e2e/performance/lighthouse.test.ts --project=chromium --timeout=60000
        working-directory: web

      - name: SEO manifest sync check
        run: npm run seo:check
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # Canonical host for sitemap/robots/SEO snapshots (public, not a secret).
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://developer-onboard.vercel.app' }}

      - name: Bundle size analysis
        run: npx vitest run test/bundle/bundle-analysis.test.ts --testTimeout 30000
        working-directory: web
