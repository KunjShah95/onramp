name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deploy-check:
    name: Validate production env vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          MISSING=""
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Missing GitHub secrets:$MISSING"
            echo "Add them in your repo: Settings → Secrets and variables → Actions"
            echo ""
            echo "Frontend deploy will be skipped (VERCEL_TOKEN/ORG_ID/PROJECT_ID)."
            echo "Backend deploy will be skipped (RENDER_DEPLOY_HOOK_URL)."
          else
            echo "✅ All required secrets configured."
          fi

  frontend:
    name: Deploy frontend → Vercel
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not configured — skipping Vercel deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets to enable."

      - uses: amondnet/vercel-action@v42
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          vercel-build: true
          working-directory: web

      - name: Smoke test — frontend
        if: env.VERCEL_TOKEN != ''
        run: |
          DEPLOYED_URL="https://${{ secrets.VERCEL_PROJECT_ID }}.vercel.app"
          echo "Checking $DEPLOYED_URL..."
          curl -fsSL -o /dev/null -w "%{http_code}" "$DEPLOYED_URL" || \
            echo "⚠️  Smoke test failed — frontend may not be reachable. Check Vercel dashboard."

  backend:
    name: Deploy backend → Render
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not configured — skipping backend deploy. Add the RENDER_DEPLOY_HOOK_URL secret to enable."

      - name: Smoke test — backend
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          sleep 30
          # Render auto-assigns a URL; this checks a generic health endpoint.
          # In practice, replace DEPLOYED_API_URL with the actual Render URL.
          DEPLOYED_API_URL="https://onramp-backend.onrender.com/health"
          echo "Checking $DEPLOYED_API_URL..."
          HTTP_CODE=$(curl -fsSL -o /dev/null -w "%{http_code}" "$DEPLOYED_API_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend smoke test passed (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Smoke test returned HTTP $HTTP_CODE — verify deployment manually."
          fi
