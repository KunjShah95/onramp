name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  ci-gate:
    if: github.ref == 'refs/heads/main'
    name: Wait for required CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Require successful CI for changed areas
        run: |
          set -euo pipefail
          # Cover every commit in the push, not just the tip.
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi
          REQUIRED_WORKFLOWS=()
          if grep -Eq '^(backend/|\.github/workflows/backend\.yml$)' <<< "$CHANGED_FILES"; then
            REQUIRED_WORKFLOWS+=("Backend CI")
          fi
          if grep -Eq '^(web/|\.github/workflows/frontend\.yml$)' <<< "$CHANGED_FILES"; then
            REQUIRED_WORKFLOWS+=("Frontend CI")
          fi
          if grep -Eq '^(sdk/|\.github/workflows/sdk\.yml$)' <<< "$CHANGED_FILES"; then
            REQUIRED_WORKFLOWS+=("SDK CI")
          fi

          if [ "${#REQUIRED_WORKFLOWS[@]}" -eq 0 ]; then
            echo "No area-specific CI workflow is required for this commit."
            exit 0
          fi

          for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
            found_run=false
            completed=false
            for attempt in {1..240}; do  # 240 × 10s = 40 min
              RUNS=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --limit 1 \
                --json status,conclusion)
              COUNT=$(jq 'length' <<< "$RUNS")
              if [ "$COUNT" -eq 0 ]; then
                if [ "$attempt" -ge 6 ]; then
                  echo "::error::No $workflow run was created for $GITHUB_SHA."
                  exit 1
                fi
                sleep 10
                continue
              fi

              found_run=true
              STATUS=$(jq -r '.[0].status' <<< "$RUNS")
              CONCLUSION=$(jq -r '.[0].conclusion // ""' <<< "$RUNS")
              if [ "$STATUS" = "completed" ]; then
                completed=true
                if [ "$CONCLUSION" != "success" ]; then
                  echo "::error::$workflow completed with $CONCLUSION."
                  exit 1
                fi
                break
              fi
              sleep 10
            done

            if [ "$found_run" != true ] || [ "$completed" != true ]; then
              echo "::error::Timed out waiting for $workflow."
              exit 1
            fi
            echo "✅ $workflow passed for $GITHUB_SHA"
          done

  pre-deploy-check:
    if: github.ref == 'refs/heads/main'
    needs: ci-gate
    name: Validate production env vars
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    outputs:
      vercel_ready: ${{ steps.credentials.outputs.vercel_ready }}
      render_ready: ${{ steps.credentials.outputs.render_ready }}
    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check required secrets are configured
        id: credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets['RENDER_DEPLOY_HOOK_URL'] }}
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          set -u
          # A target whose credentials are incomplete is skipped (with a
          # warning) rather than failing CD; the other target still deploys.
          vercel_ready=true
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              vercel_ready=false
              echo "::warning::Missing Production secret $var — frontend deploy will be skipped."
            fi
          done
          render_ready=true
          for var in RENDER_DEPLOY_HOOK_URL RENDER_SERVICE_URL; do
            if [ -z "${!var}" ]; then
              render_ready=false
              echo "::warning::Missing Production secret $var — backend deploy will be skipped."
            fi
          done
          if [ "$vercel_ready" = true ] && [ "$render_ready" = true ]; then
            echo "✅ All required Production environment secrets configured."
          else
            echo "Configure missing values in: GitHub → Settings → Environments → Production → Environment secrets"
          fi
          echo "vercel_ready=$vercel_ready" >> "$GITHUB_OUTPUT"
          echo "render_ready=$render_ready" >> "$GITHUB_OUTPUT"

  frontend:
    name: Deploy frontend → Vercel
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}
      VERCEL_READY: ${{ needs.pre-deploy-check.outputs.vercel_ready }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Skip notice
        if: env.VERCEL_READY != 'true'
        run: echo "Vercel credentials incomplete — skipping frontend deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."

      - uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        if: env.VERCEL_READY == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: web

      - name: Smoke test — frontend
        if: env.VERCEL_READY == 'true'
        run: |
          set -euo pipefail
          # Fetch the verified production domain from Vercel. A deployment can
          # take a few seconds to become the active alias, so retry briefly.
          DEPLOYED_URL=""
          for attempt in {1..12}; do
            DEPLOYED_URL=$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/domains" \
              | python3 -c "import sys,json; data=json.load(sys.stdin); print(next((d['name'] for d in data.get('domains',[]) if d.get('verified')), ''))" 2>/dev/null || true)
            [ -n "$DEPLOYED_URL" ] && break
            sleep 5
          done
          if [ -z "$DEPLOYED_URL" ]; then
            echo "❌ Vercel returned no verified production domain."
            exit 1
          fi
          case "$DEPLOYED_URL" in
            http://*|https://*) FULL_URL="$DEPLOYED_URL" ;;
            *) FULL_URL="https://${DEPLOYED_URL}" ;;
          esac
          echo "Checking $FULL_URL..."
          HTTP_CODE="000"
          for attempt in {1..12}; do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$FULL_URL" 2>/dev/null || true)
            case "$HTTP_CODE" in
              200|301|302) echo "✅ Frontend smoke test passed (HTTP $HTTP_CODE)"; exit 0 ;;
            esac
            sleep 5
          done
          echo "❌ Frontend smoke test returned HTTP $HTTP_CODE"
          exit 1

  backend:
    name: Deploy backend → Render
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
      RENDER_READY: ${{ needs.pre-deploy-check.outputs.render_ready }}

    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_READY == 'true'
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip notice
        if: env.RENDER_READY != 'true'
        run: echo "Render credentials incomplete — skipping backend deploy. Add RENDER_DEPLOY_HOOK_URL and RENDER_SERVICE_URL."

      - name: Smoke test — backend
        if: env.RENDER_READY == 'true'
        run: |
          set -euo pipefail
          DEPLOYED_API_URL="${RENDER_SERVICE_URL%/}"
          case "$DEPLOYED_API_URL" in
            http://*|https://*) ;;
            *) echo "❌ RENDER_SERVICE_URL must be an http(s) origin."; exit 1 ;;
          esac
          for endpoint in /health /ready; do
            URL="$DEPLOYED_API_URL$endpoint"
            echo "Checking $URL..."
            HTTP_CODE="000"
            for attempt in {1..24}; do
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || true)
              [ "$HTTP_CODE" = "200" ] && break
              sleep 5
            done
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ $endpoint smoke test returned HTTP $HTTP_CODE"
              exit 1
            fi
            echo "✅ $endpoint smoke test passed (HTTP $HTTP_CODE)"
          done
