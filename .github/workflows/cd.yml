name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-check:
    name: Validate production env vars
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA (supply-chain hardening); the tag is in a comment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check required secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          MISSING=""
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_DEPLOY_HOOK_URL RENDER_SERVICE_URL; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "⚠️  Missing GitHub secrets:$MISSING"
            echo "Add them in your repo: Settings → Secrets and variables → Actions"
            echo ""
            echo "Frontend deploy will be skipped (VERCEL_TOKEN/ORG_ID/PROJECT_ID)."
            echo "Backend deploy will be skipped (RENDER_DEPLOY_HOOK_URL)."
          else
            echo "✅ All required secrets configured."
          fi

  frontend:
    name: Deploy frontend → Vercel
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Skip notice
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not configured — skipping Vercel deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets to enable."

      - uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          vercel-build: true
          working-directory: web

      - name: Smoke test — frontend
        if: env.VERCEL_TOKEN != ''
        run: |
          # Fetch the production deployment URL from Vercel API
          DEPLOYED_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/domains" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); print(next((d['name'] for d in data.get('domains',[]) if d.get('verified')), 'unknown'))" 2>/dev/null || echo "https://onramp.vercel.app")
          FULL_URL="https://${DEPLOYED_URL}"
          echo "Checking $FULL_URL..."
          HTTP_CODE=$(curl -fsSL -o /dev/null -w "%{http_code}" "$FULL_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Frontend smoke test passed (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Smoke test returned HTTP $HTTP_CODE — verify deployment manually."
          fi

  backend:
    name: Deploy backend → Render
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not configured — skipping backend deploy. Add the RENDER_DEPLOY_HOOK_URL secret to enable."

      - name: Smoke test — backend
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          sleep 30
          # Use RENDER_DEPLOY_HOOK_URL to derive the service URL
          # Render hooks follow: https://api.render.com/deploy/srv-<id>?key=<key>
          # The actual service URL should be configured as a secret.
          DEPLOYED_API_URL="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$DEPLOYED_API_URL" ]; then
            echo "⚠️  RENDER_SERVICE_URL not configured — skipping smoke test."
            echo "Add it as a GitHub secret (e.g. https://onramp-backend.onrender.com)."
            exit 0
          fi
          DEPLOYED_API_URL="${DEPLOYED_API_URL}/health"
          echo "Checking $DEPLOYED_API_URL..."
          HTTP_CODE=$(curl -fsSL -o /dev/null -w "%{http_code}" "$DEPLOYED_API_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend smoke test passed (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Smoke test returned HTTP $HTTP_CODE — verify deployment manually."
          fi
