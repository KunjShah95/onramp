apiVersion: apps/v1
kind: Deployment
metadata:
  name: onramp-backend
  labels:
    app: onramp
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: onramp
      component: backend
  template:
    metadata:
      labels:
        app: onramp
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: onramp-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: onramp-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: OPENROUTER_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: ANTHROPIC_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GROQ_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: MISTRAL_API_KEY
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: HUGGINGFACE_API_KEY
            - name: NEON_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: NEON_AUTH_URL
            - name: AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: AUTH_DB_URL
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_KEY_SECRET
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_WEBHOOK_SECRET
            - name: RAZORPAY_PLAN_STARTUP
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_PLAN_STARTUP
            - name: RAZORPAY_PLAN_PROFESSIONAL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_PLAN_PROFESSIONAL
            - name: RAZORPAY_PLAN_USAGE_BASED
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: RAZORPAY_PLAN_USAGE_BASED
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: SENDGRID_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: JWT_SECRET
            - name: API_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: API_KEY_HMAC_SECRET
            - name: PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: PII_ENCRYPTION_KEY
            - name: GITHUB_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GITHUB_TOKEN_ENCRYPTION_KEY
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: BACKEND_URL
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: FRONTEND_URL
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: onramp-secrets
                  key: SENTRY_DSN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          # Probes hit the ops router mounted at the root of the API:
          # /health (liveness) and /ready (readiness, checks DB + Redis).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
