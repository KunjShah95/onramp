apiVersion: v1
kind: ConfigMap
metadata:
  name: onramp-config
  labels:
    app: onramp
data:
  ENVIRONMENT: "production"
  ENV: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "onramp-redis"
  REDIS_PORT: "6379"
  DB_SSL_MODE: "require"
  # The backend reads CORS_ALLOWED_ORIGINS (comma-separated) — CORS_ORIGINS was a dead var.
  CORS_ALLOWED_ORIGINS: "https://onramp.app"
  LLM_PROVIDER: "openrouter"
---
apiVersion: v1
kind: Secret
metadata:
  name: onramp-secrets
  labels:
    app: onramp
type: Opaque
stringData:
  REDIS_PASSWORD: ""
  DB_PASSWORD: ""
  DATABASE_URL: ""
  OPENROUTER_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  MISTRAL_API_KEY: ""
  HUGGINGFACE_API_KEY: ""
  NEON_AUTH_URL: ""
  AUTH_DB_URL: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  RAZORPAY_PLAN_STARTUP: ""
  RAZORPAY_PLAN_PROFESSIONAL: ""
  RAZORPAY_PLAN_USAGE_BASED: ""
  SENDGRID_API_KEY: ""
  # Boot-required in production (cache_service + rate limiting).
  # Fill with e.g. redis://:${REDIS_PASSWORD}@onramp-redis:6379/0 at apply time.
  REDIS_URL: ""
  JWT_SECRET: ""
  API_KEY_HMAC_SECRET: ""
  PII_ENCRYPTION_KEY: ""
  GITHUB_TOKEN_ENCRYPTION_KEY: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_WEBHOOK_SECRET: ""
  BACKEND_URL: ""
  FRONTEND_URL: ""
  SENTRY_DSN: ""
